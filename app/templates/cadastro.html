{% extends "base.html" %}
{% block titulo %}Cadastro — Pizzaria Delivery{% endblock %}
{% block conteudo %}
<section class="cartao estreito">
  <h1>Criar conta</h1>
  <form method="post" novalidate>
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label for="nome">Nome completo</label>
    <input id="nome" name="nome" value="{{ dados.get('nome', '') }}" required maxlength="100" autocomplete="name">
    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" value="{{ dados.get('email', '') }}" required autocomplete="email">
    <label for="telefone">Telefone com DDD</label>
    <input id="telefone" name="telefone" type="tel" value="{{ dados.get('telefone', '') }}" required maxlength="20" autocomplete="tel">
    <label for="senha">Senha (mínimo 6 caracteres)</label>
    <input id="senha" name="senha" type="password" required minlength="6" autocomplete="new-password">
    <button class="botao" type="submit">Cadastrar</button>
  </form>
  <p class="apoio">Já tem conta? <a href="{{ url_for('auth.login') }}">Entrar</a></p>
</section>
{% endblock %}
