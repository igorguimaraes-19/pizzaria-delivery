{% extends "base.html" %}
{% block titulo %}Entrar — Pizzaria Delivery{% endblock %}
{% block conteudo %}
<section class="cartao estreito">
  <h1>Entrar</h1>
  <form method="post" novalidate>
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" value="{{ email }}" required autocomplete="email">
    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" required autocomplete="current-password">
    <button class="botao" type="submit">Entrar</button>
  </form>
  <p class="apoio">Ainda não tem conta? <a href="{{ url_for('auth.cadastro') }}">Cadastre-se</a></p>
</section>
{% endblock %}
